<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة تمارين البيت</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f7fa;--card:#fff;--tx:#14283d;--mu:#6b7f93;--pr:#0f9d8a;--ac:#f6c744;--ln:#e1eaf0;--sh:0 4px 16px rgba(20,40,61,.07);--hd:#16324f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1824;--card:#15263a;--tx:#e8f0f7;--mu:#8fa3b6;--pr:#21c3ac;--ln:#223850;--sh:none;--hd:#0a1320}}
:root[data-theme="dark"]{--bg:#0d1824;--card:#15263a;--tx:#e8f0f7;--mu:#8fa3b6;--pr:#21c3ac;--ln:#223850;--sh:none;--hd:#0a1320}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:400 15px/1.6 Cairo,system-ui,"Segoe UI",Tahoma,sans-serif}
button,input{font-family:inherit}
.app{max-width:560px;margin:auto;padding:14px 14px 150px}
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px;border-radius:26px;color:#fff;background:linear-gradient(135deg,#16324f 30%,#0f9d8a);margin-bottom:14px}
.hero small{opacity:.8}.hero h1{font-size:23px;font-weight:800;line-height:1.35}.hero p{opacity:.92;font-size:14px}
.card{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);border:1px solid var(--ln)}
.ex.dn{border-color:var(--pr)}
.top{display:flex;align-items:center;gap:12px}
.em{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:25px;background:rgba(15,157,138,.14)}
.inf{flex:1;min-width:0}.inf b{display:block;font-weight:800;line-height:1.3}.inf small{color:var(--mu);font-size:12px}
.chip{background:var(--ac);color:#3a2f00;font-weight:800;font-size:12px;padding:3px 10px;border-radius:99px;white-space:nowrap}
.sets{display:flex;gap:10px;align-items:center;margin:12px 0 4px}
.st{width:48px;height:48px;border-radius:50%;border:2px solid var(--ln);background:transparent;color:var(--mu);font-size:17px;font-weight:800;cursor:pointer;transition:transform .15s,background .2s}
.st.on{background:var(--pr);border-color:var(--pr);color:#fff;transform:scale(1.07)}
.st:active{transform:scale(.9)}
.tm{margin-inline-start:auto;border:1.5px solid var(--pr);color:var(--pr);background:none;border-radius:99px;padding:8px 14px;font-weight:700;cursor:pointer}
.tg{background:none;border:0;color:var(--pr);font-size:13px;font-weight:600;cursor:pointer;padding:6px 0}
.how{background:rgba(15,157,138,.1);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:4px}
.btn{display:block;width:100%;background:var(--pr);color:#fff;border:0;border-radius:14px;padding:12px 18px;font-size:15px;font-weight:800;cursor:pointer;margin-top:10px}
.btn.g{background:none;color:#d64545;border:1.5px solid #d64545}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid .card{margin:0;text-align:center}
.grid b{display:block;font-size:28px;font-weight:800;color:var(--pr);line-height:1.2}.grid small{color:var(--mu)}
h2{font-size:16px;font-weight:800;margin-bottom:10px}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--pr);border-radius:9px;transition:width .4s}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat i{aspect-ratio:1;border-radius:9px;background:var(--ln);font-style:normal;font-size:11px;display:grid;place-items:center;color:var(--mu)}
.heat .dh{background:none;font-weight:700;aspect-ratio:auto}
.heat .h2{background:rgba(15,157,138,.45);color:#fff}.heat .h3{background:var(--pr);color:#fff}.heat .f{opacity:.35}.heat .td{outline:2px solid var(--ac)}
.wr{display:flex;gap:8px}
.wr input{flex:1;min-width:0;border:1.5px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:12px;padding:10px 12px;font-size:16px}
.wr .btn{width:auto;margin:0;padding:10px 20px}
.li{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--ln);font-size:14px}
.li button{background:none;border:0;color:var(--mu);font-size:16px;cursor:pointer;padding:0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:8px 15px;border-radius:99px;border:1.5px solid var(--ln);background:none;color:var(--tx);font-weight:600;cursor:pointer}
.chips .on{background:var(--pr);border-color:var(--pr);color:#fff}
.mu{color:var(--mu);font-size:13px;margin-top:8px}
nav{position:fixed;inset-inline:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--ln);z-index:5}
nav button{flex:1;max-width:170px;border:0;background:none;color:var(--mu);border-radius:14px;padding:5px;font-size:12px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center}
nav button span{font-size:20px;line-height:1.3}
nav .on{color:var(--pr);background:rgba(15,157,138,.13)}
#tmr{position:fixed;left:14px;right:14px;max-width:532px;margin:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--hd);color:#fff;border-radius:18px;padding:12px 16px;z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#tmr[hidden]{display:none}
#tmr.fin{background:var(--pr)}
#tt{font-size:26px;font-weight:800;min-width:60px;font-variant-numeric:tabular-nums}
#tl{flex:1;font-weight:600}
#tmr button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:99px;padding:6px 16px;font-weight:700;cursor:pointer}
#tmr .bar{width:100%;background:rgba(255,255,255,.2);margin:0}#tmr .bar i{background:var(--ac)}
</style>
</head>
<body>
<div class="app" id="v"></div>
<div id="tmr" hidden><span id="tt"></span><span id="tl"></span><button id="sk">تخطي</button><div class="bar"><i id="tb"></i></div></div>
<nav><button data-t="today"><span>🏋️</span>اليوم</button><button data-t="prog"><span>📈</span>تقدمي</button><button data-t="plan"><span>🗓️</span>الجدول</button></nav>
<script>
const EX=[
{n:'تمرين الضغط',en:'Push-ups',e:'💪',m:'الصدر · الأكتاف · الترايسبس',r:'8–12',t:'إذا كان صعباً ابدأ وركبتاك على الأرض، أو استند على حافة السرير/الطاولة.'},
{n:'السكوات',en:'Squats',e:'🦵',m:'الفخذين · المؤخرة · أسفل الظهر',r:'12–15',t:'انزل واصعد ببطء كأنك تجلس على كرسي وهمي. يمكنك حمل شنطة ظهر لزيادة الصعوبة.'},
{n:'سحب الحقيبة',en:'Bag Rows',e:'🎒',m:'الظهر · البايسبس',r:'10–12',t:'امسك شنطة ظهر مليئة بالكتب، انحنِ بظهر مفرود (زاوية 45°)، واسحب الشنطة نحو بطنك.'},
{n:'الضغط العسكري',en:'Pike Push-ups',e:'🔺',m:'الأكتاف · أعلى الصدر',r:'8–10',t:'ارفع حوضك للأعلى ليشكل جسمك حرف V مقلوب، ثم انزل برأسك نحو الأرض ببطء واصعد.'},
{n:'البلانك',en:'Plank',e:'🧱',m:'عضلات البطن والـ core',r:'30–45 ثانية',tm:45,t:'ارتكز على الساعدين وأطراف القدمين مع شد البطن والمؤخرة بشكل مستقيم بدون هبوط الخصر.'},
{n:'رفع الأرجل',en:'Leg Raises',e:'⬆️',m:'عضلات البطن السفلية',r:'12–15',t:'استلقِ على ظهرك وارفع رجليك معاً لزاوية 90° ثم انزل بهما ببطء دون ملامسة الأرض.'}];
const DN=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'],K='homefit-v1',$=s=>document.querySelector(s),T=EX.length*3;
let S={days:[6,1,3],log:{},w:[]},tab='today',open=-1,rc=0,ti,th;
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{S.u=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}window.cloudPush&&cloudPush()};
const p2=n=>String(n).padStart(2,'0');
const key=d=>{d=d||new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const ent=k=>S.log[k]||(S.log[k]={s:EX.map(()=>[0,0,0])});
const cnt=k=>{const e=S.log[k];return e?e.s.flat().reduce((a,b)=>a+b,0):0};
const dn=k=>cnt(k)==T;
function ring(p){return `<svg viewBox="0 0 80 80" width="88" height="88"><circle cx="40" cy="40" r="34" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="8"/><circle cx="40" cy="40" r="34" fill="none" stroke="#f6c744" stroke-width="8" stroke-linecap="round" stroke-dasharray="${2.136*p} 214" transform="rotate(-90 40 40)"/><text x="40" y="46" text-anchor="middle" fill="#fff" font-size="18" font-weight="800">${p}%</text></svg>`}
function vToday(){
 const k=key(),d=new Date(),e=S.log[k],on=S.days.includes(d.getDay())||(e&&e.x),c=cnt(k),p=Math.round(c/T*100);
 const date=d.toLocaleDateString('ar-EG-u-nu-latn',{weekday:'long',day:'numeric',month:'long'});
 const ttl=p==100?'أحسنت! خلصت تمرين اليوم 🎉':on?'جاهز للتمرين؟ 💪':'اليوم يوم راحة 😴';
 let h=`<div class="hero"><div><small>${date}</small><h1>${ttl}</h1><p>${on?`${c} من ${T} مجموعة · تبقّى ${T-c}`:'العضلات بتتبني وقت الراحة'}</p></div>${on?ring(p):''}</div>`;
 if(!on)return h+`<div class="card"><p>مش من أيام تمرينك النهارده. عايز تتمرن برضه؟</p><button class="btn" data-a="force">ابدأ تمرين اليوم</button></div>`;
 h+=EX.map((x,i)=>{const s=e?e.s[i]:[0,0,0];
  return `<div class="card ex ${s.every(Boolean)?'dn':''}"><div class="top"><div class="em">${x.e}</div><div class="inf"><b>${x.n}</b><small>${x.en} · ${x.m}</small></div><span class="chip">3 × ${x.r}</span></div>
  <div class="sets">${s.map((v,j)=>`<button class="st ${v?'on':''}" data-a="set" data-i="${i}" data-j="${j}">${v?'✓':j+1}</button>`).join('')}${x.tm?`<button class="tm" data-a="tm" data-i="${x.tm}">⏱ ${x.tm} ثانية</button>`:''}</div>
  <button class="tg" data-a="open" data-i="${i}">طريقة الأداء ${open==i?'▴':'▾'}</button>${open==i?`<p class="how">${x.t}</p>`:''}</div>`}).join('');
 return h+`<p class="mu">💡 خد راحة دقيقة إلى دقيقة ونصف بين كل مجموعة — المؤقت بيبدأ تلقائياً لما تعلّم مجموعة.</p>`}
function vProg(){
 const ks=Object.keys(S.log),total=ks.filter(dn).length,sets=ks.reduce((a,k)=>a+cnt(k),0),now=new Date(),tk=key();
 let st=0;for(let i=0;i<150;i++){const d=addD(now,-i);if(dn(key(d)))st++;else if(S.days.includes(d.getDay())&&i>0)break}
 const ws=addD(now,-((now.getDay()+1)%7));let wk=0;for(let i=0;i<7;i++)if(dn(key(addD(ws,i))))wk++;
 const goal=S.days.length,hs=addD(ws,-28);
 let hc=['س','ح','ن','ث','ر','خ','ج'].map(l=>`<i class="dh">${l}</i>`).join('');
 for(let i=0;i<35;i++){const d=addD(hs,i),k=key(d),c=cnt(k);hc+=`<i class="${k>tk?'f':c==T?'h3':c?'h2':''} ${k==tk?'td':''}">${d.getDate()}</i>`}
 const w=[...S.w].sort((a,b)=>a.d<b.d?-1:1).slice(-12);let ch='',df='';
 if(w.length>1){const vs=w.map(x=>x.v),mn=Math.min(...vs),mx=Math.max(...vs),pt=w.map((x,i)=>[10+i*280/(w.length-1),70-(x.v-mn)/((mx-mn)||1)*55]),f=w[w.length-1].v-w[0].v;
  df=` · ${f>0?'+':''}${f.toFixed(1)} كجم`;
  ch=`<svg viewBox="0 0 300 80" width="100%"><polyline points="${pt.map(q=>q.join(',')).join(' ')}" fill="none" stroke="var(--pr)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${pt.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="var(--pr)"/>`).join('')}</svg>`}
 return `<div class="grid"><div class="card"><b>🔥 ${st}</b><small>تمرين متتالي</small></div><div class="card"><b>${wk}/${goal}</b><small>تمارين هذا الأسبوع</small></div><div class="card"><b>${total}</b><small>تمرين مكتمل</small></div><div class="card"><b>${sets}</b><small>مجموعة منجزة</small></div></div>
 <div class="card"><h2>هدف الأسبوع</h2><small class="mu">${wk>=goal?'حققت هدفك! 🏆':`باقي ${goal-wk} تمرين لتحقيق هدف الأسبوع`}</small><div class="bar"><i style="width:${Math.min(100,wk/goal*100)}%"></i></div></div>
 <div class="card"><h2>آخر 5 أسابيع</h2><div class="heat">${hc}</div><p class="mu">الفاتح: تمرين جزئي · الغامق: تمرين كامل</p></div>
 <div class="card"><h2>وزن الجسم${w.length?` · ${w[w.length-1].v} كجم${df}`:''}</h2>${ch}<div class="wr"><input id="wi" type="number" inputmode="decimal" step="0.1" placeholder="وزنك النهارده (كجم)"><button class="btn" data-a="wadd">سجّل</button></div>${w.slice(-4).reverse().map(x=>`<div class="li"><span>${x.d}</span><span>${x.v} كجم <button data-a="wdel" data-i="${S.w.indexOf(x)}" aria-label="حذف">✕</button></span></div>`).join('')}</div>`}
function cloudCard(){
 if(!window.CLOUD)return '';
 const u=window.cu;
 return `<div class="card"><h2>☁️ المزامنة</h2>${u?`<p>متصل بحساب <b>${u.email}</b></p><p class="mu">بياناتك بتتحفظ على السحابة وتظهر على أي جهاز تسجل منه.</p><button class="btn g" data-a="logout">تسجيل الخروج</button>`:`<p class="mu" style="margin-top:0">سجّل دخول بجوجل عشان بياناتك تتحفظ وتتزامن بين كل أجهزتك.</p><button class="btn" data-a="login">تسجيل الدخول بجوجل</button>`}</div>`}
function vPlan(){
 return cloudCard()+`<div class="card"><h2>أيام التمرين</h2><div class="chips">${[6,0,1,2,3,4,5].map(d=>`<button class="${S.days.includes(d)?'on':''}" data-a="day" data-i="${d}">${DN[d]}</button>`).join('')}</div><p class="mu">اختر من 3 إلى 4 أيام في الأسبوع (يوم بعد يوم)، وباقي الأيام راحة.</p></div>
 <div class="card"><h2>تمارين الجسم الكامل</h2>${EX.map(x=>`<div class="li"><span>${x.e} ${x.n}</span><span>3 × ${x.r}</span></div>`).join('')}<p class="mu">💧 اشرب مية كتير · الاستمرارية بتصنع الفرق</p></div>
 <button class="btn g" data-a="reset">${rc?'اضغط مرة أخرى لتأكيد مسح كل البيانات':'مسح كل البيانات'}</button>`}
function render(){$('#v').innerHTML={today:vToday,prog:vProg,plan:vPlan}[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab))}
function timer(sec,label){
 clearInterval(ti);clearTimeout(th);const t=$('#tmr'),end=Date.now()+sec*1000;t.hidden=false;t.classList.remove('fin');
 const tick=()=>{const r=Math.max(0,Math.ceil((end-Date.now())/1000));$('#tl').textContent=label;$('#tt').textContent=Math.floor(r/60)+':'+p2(r%60);$('#tb').style.width=100*(1-r/sec)+'%';
  if(!r){clearInterval(ti);t.classList.add('fin');$('#tl').textContent='انتهى الوقت 💪';try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}th=setTimeout(()=>t.hidden=true,3500)}};
 tick();ti=setInterval(tick,250)}
function stopT(){clearInterval(ti);clearTimeout(th);$('#tmr').hidden=true}
function act(a,i,j){
 const k=key();
 if(a=='set'){const e=ent(k),v=e.s[i][j]=e.s[i][j]?0:1;save();render();if(v){if(dn(k))stopT();else timer(90,'راحة بين المجموعات')}}
 else if(a=='open'){open=open==i?-1:+i;render()}
 else if(a=='tm')timer(+i,'ثبات البلانك')
 else if(a=='force'){ent(k).x=1;save();render()}
 else if(a=='day'){const d=+i,n=S.days.indexOf(d);if(n>-1){if(S.days.length>1)S.days.splice(n,1)}else S.days.push(d);save();render()}
 else if(a=='wadd'){const v=parseFloat($('#wi').value);if(!(v>20&&v<400)){$('#wi').focus();return}S.w=S.w.filter(x=>x.d!=k);S.w.push({d:k,v});save();render()}
 else if(a=='wdel'){S.w.splice(+i,1);save();render()}
 else if(a=='reset'){if(rc){S.log={};S.w=[];save();rc=0}else rc=1;render()}
 else if(a=='login')cloudLogin()
 else if(a=='logout')cloudLogout()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset.i,b.dataset.j)});
$('nav').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;rc=0;render();scrollTo(0,0)}};
$('#sk').onclick=stopT;
window.getLocal=()=>S;
window.applyRemote=o=>{S=Object.assign({days:[6,1,3],log:{},w:[]},o);try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}render()};
render();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,onSnapshot,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== الصق إعدادات Firebase بتاعتك هنا (من Project settings > Your apps) ===== */
const firebaseConfig={
  apiKey:"AIzaSyAsQT2xpTj9oZWCQiBSakW_F-Ypd1mmAQA",
  authDomain:"manhome.firebaseapp.com",
  projectId:"manhome",
  appId:"1:893415042969:web:b5d8587c44246acc33ad08"
};
/* ============================================================================== */

if(firebaseConfig.apiKey){
  const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
  let ref=null,unsub=null;
  window.CLOUD=true;
  window.cloudLogin=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>alert('تعذّر تسجيل الدخول: '+e.code));
  window.cloudLogout=()=>signOut(auth);
  window.cloudPush=()=>{
    if(!ref)return;
    const s=getLocal();if(!s.u)s.u=Date.now();
    setDoc(ref,{d:JSON.stringify(s),u:s.u}).catch(()=>{});
  };
  onAuthStateChanged(auth,u=>{
    window.cu=u;if(unsub)unsub();ref=null;
    if(u){
      ref=doc(db,'users',u.uid);
      unsub=onSnapshot(ref,snap=>{
        const r=snap.exists()?snap.data():null,l=getLocal();
        if(r&&r.u>(l.u||0))applyRemote(JSON.parse(r.d));
        else if(!r||r.u<(l.u||0))cloudPush();
      });
    }
    render();
  });
}
</script>
</body>
</html>
